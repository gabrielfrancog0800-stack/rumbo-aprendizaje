<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Organizá tus aprendizajes y compartí avances claros con tu equipo.">
  <title>Rumbo · Mi aprendizaje</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>
  <aside class="sidebar">
    <a class="brand" href="#hoy" aria-label="Rumbo, inicio">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M7 24V8h8.5c4.8 0 7.5 2.2 7.5 6.2 0 3-1.6 5-4.5 5.8L24 24h-5.4l-4.7-3.6H12V24H7Z"/></svg></span>
      <span>Rumbo</span>
    </a>
    <nav aria-label="Navegación principal">
      <a href="#hoy" data-nav="hoy" data-collaborator><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m9 12 2 2 4-5"/></svg><span>Hoy</span></a>
      <a href="#panel" data-nav="panel" data-collaborator><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 9h8M8 13h5"/></svg><span>Aprendizajes</span></a>
      <a href="#equipo" data-nav="equipo" data-admin hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c.4-3.4 2-5 5-5s4.6 1.6 5 5m1-4c2.8 0 4.4 1.3 4.8 4"/></svg><span>Equipo</span></a>
      <button class="nav-account" data-action="account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20c.5-4 2.8-6 7-6s6.5 2 7 6"/></svg><span class="nav-label">Cuenta</span><span class="account-meta"><strong id="profile-name">Mi cuenta</strong><small id="cloud-label">Sin conectar</small></span></button>
    </nav>
  </aside>
  <main>
    <div id="storage-warning" class="warning" role="alert" hidden></div>
    <section id="view"></section>
  </main>
  <dialog id="detail-dialog" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
  <dialog id="progress-dialog" aria-labelledby="progress-title"><form id="progress-form"><div class="dialog-heading"><h2 id="progress-title">Registrar avance</h2><button type="button" data-close="progress-dialog" class="icon-button" aria-label="Cerrar">×</button></div><p id="progress-step-label"></p><div class="form-row"><label>Minutos<input name="minutes" type="number" min="5" max="600" step="5" value="15" required></label><label>Fecha<input name="date" type="date" required></label></div><label>Nota privada <span class="optional">Opcional</span><textarea name="note" rows="3" maxlength="300" placeholder="¿Qué lograste?"></textarea></label><label class="check-label"><input name="complete" type="checkbox"> Marcar el paso como completado</label><button class="primary" type="submit">Guardar</button></form></dialog>
  <dialog id="account-dialog" aria-labelledby="account-title"><div class="dialog-heading"><h2 id="account-title">Cuenta</h2><button type="button" data-close="account-dialog" class="icon-button" aria-label="Cerrar">×</button></div><div id="account-content"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
